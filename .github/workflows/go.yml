name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
      - 'Release_*'
      - 'release-*'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  test:
    name: Run Tests & Linters
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Run Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v ./...

  release:
    name: Build & Publish Release Assets
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Cross-Compile Binaries
        run: |
          # Linux AMD64
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o cluster-tui-linux-amd64 main.go

          # Windows AMD64
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o cluster-tui-windows-amd64.exe main.go

          # macOS ARM64 (Apple Silicon)
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o cluster-tui-darwin-arm64 main.go

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cluster-tui-linux-amd64
            cluster-tui-windows-amd64.exe
            cluster-tui-darwin-arm64
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
