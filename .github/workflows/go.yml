name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build TUI Application
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Run Linter / Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v ./...

      - name: Build TUI Binary
        run: |
          go build -ldflags="-s -w" -o cluster-tui main.go

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cluster-tui-linux-amd64
          path: cluster-tui
          retention-days: 7
