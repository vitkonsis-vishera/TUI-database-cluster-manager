name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build TUI Application
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Run Linter / Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v ./...

      - name: Build TUI Binary
        run: |
          go build -ldflags="-s -w" -o cluster-tui main.go

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cluster-tui-linux-amd64
          path: cluster-tui
          retention-days: 7
name: Release Binaries

on:
  push:
    tags:
      - 'v*' # Срабатывает при создании тега, например: v0.1, v1.0.0

permissions:
  contents: write # Разрешение на загрузку файлов в GitHub Release

jobs:
  release:
    name: Build and Upload Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Cross-Compile Binaries
        run: |
          # Сборка под Linux AMD64
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o cluster-tui-linux-amd64 main.go

          # Сборка под Windows AMD64
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o cluster-tui-windows-amd64.exe main.go

          # Сборка под macOS ARM64 (Apple Silicon)
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o cluster-tui-darwin-arm64 main.go

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cluster-tui-linux-amd64
            cluster-tui-windows-amd64.exe
            cluster-tui-darwin-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
